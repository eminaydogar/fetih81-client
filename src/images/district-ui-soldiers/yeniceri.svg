<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5a40"/>
      <stop offset="1" stop-color="#1f3a28"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e9c8"/>
      <stop offset="0.5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer shield -->
  <path d="M100 6 L188 32 L188 120 Q188 196 100 234 Q12 196 12 120 L12 32 Z"
        fill="url(#metal)"/>
  <path d="M100 16 L180 39 L180 118 Q180 189 100 223 Q20 189 20 118 L20 39 Z"
        fill="#c9a961"/>
  <path d="M100 24 L172 45 L172 116 Q172 183 100 214 Q28 183 28 116 L28 45 Z"
        fill="url(#bg)"/>
  <path d="M100 24 L172 45 L172 116 Q172 183 100 214 Q28 183 28 116 L28 45 Z"
        fill="url(#glow)"/>
  <path d="M100 33 L164 51 L164 114 Q164 176 100 204 Q36 176 36 114 L36 51 Z"
        fill="none" stroke="#f4e9c8" stroke-width="1.5" stroke-opacity="0.5"/>


  <g transform="translate(100,118)">
    <!-- börk (tall white cap) -->
    <path d="M-26 34 Q-30 -34 0 -58 Q30 -34 26 34 Z" fill="#f0ede4"/>
    <path d="M-26 34 Q-30 -34 0 -58 Q30 -34 26 34 Z" fill="none" stroke="#cfc9ba" stroke-width="1.5"/>
    <!-- kaşıklık / front plate -->
    <path d="M-14 34 L-14 -20 Q0 -32 14 -20 L14 34 Z" fill="#d4b455"/>
    <ellipse cx="0" cy="-14" rx="9" ry="10" fill="#8a6d2f"/>
    <path d="M0 -22 L3 -14 L0 -6 L-3 -14 Z" fill="#f4e9c8"/>
    <!-- tuğ (plume socket) -->
    <rect x="-4" y="-64" width="8" height="12" rx="2" fill="#c9a961"/>
    <path d="M0 -64 Q-8 -92 0 -104 Q8 -92 0 -64" fill="#e8ded0" opacity="0.9"/>
    <!-- face shadow -->
    <ellipse cx="0" cy="20" rx="16" ry="20" fill="#000" opacity="0.12"/>
  </g>

</svg>