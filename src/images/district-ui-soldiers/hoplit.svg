    <path d="M-24 -30 Q-26 -8 -20 18 Q-16 40 0 44 Q16 40 20 18 Q26 -8 24 -30 Q0 -40 -24 -30 Z" fill="url(#metal)"/>
    <!-- T-shape face opening -->
    <path d="M-3 -20 L3 -20 L3 6 L14 6 L14 20 Q0 30 -14 20 L-14 6 L-3 6 Z" fill="#241a0e" opacity="0.7"/>
    <!-- brow curve -->
    <path d="M-24 -30 Q0 -40 24 -30" fill="none" stroke="#8a6d2f" stroke-width="3"/>
    <!-- rivets -->
    <circle cx="-18" cy="-4" r="2" fill="#8a6d2f"/>
    <circle cx="18" cy="-4" r="2" fill="#8a6d2f"/>
  </g>

</svg>