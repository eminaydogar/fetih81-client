    <path d="M-4 -54 Q0 -74 4 -54 L20 -46 Q26 -40 20 -34 L-20 -34 Q-26 -40 -20 -46 Z" fill="#b23a2e"/>
    <path d="M-20 -46 L20 -46" stroke="#7d2419" stroke-width="1.5"/>
