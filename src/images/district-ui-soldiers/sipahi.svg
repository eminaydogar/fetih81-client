<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3728"/>
      <stop offset="1" stop-color="#291d12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e9c8"/>
      <stop offset="0.5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer shield -->
  <path d="M100 6 L188 32 L188 120 Q188 196 100 234 Q12 196 12 120 L12 32 Z"
        fill="url(#metal)"/>
  <path d="M100 16 L180 39 L180 118 Q180 189 100 223 Q20 189 20 118 L20 39 Z"
        fill="#d4b455"/>
  <path d="M100 24 L172 45 L172 116 Q172 183 100 214 Q28 183 28 116 L28 45 Z"
        fill="url(#bg)"/>
  <path d="M100 24 L172 45 L172 116 Q172 183 100 214 Q28 183 28 116 L28 45 Z"
        fill="url(#glow)"/>
  <path d="M100 33 L164 51 L164 114 Q164 176 100 204 Q36 176 36 114 L36 51 Z"
        fill="none" stroke="#f4e9c8" stroke-width="1.5" stroke-opacity="0.5"/>


  <g transform="translate(100,116)">
    <!-- crossed spears -->
    <g stroke="#8a6d2f" stroke-width="3.5" stroke-linecap="round">
      <line x1="-36" y1="44" x2="30" y2="-50"/>
      <line x1="36" y1="44" x2="-30" y2="-50"/>
    </g>
    <path d="M30 -50 l10 -10 l0 14 z" fill="#d4b455"/>
    <path d="M-30 -50 l-10 -10 l0 14 z" fill="#d4b455"/>
    <!-- turban-wrapped helm (şişak) -->
    <path d="M-24 8 Q-28 -34 0 -40 Q28 -34 24 8 Z" fill="url(#metal)"/>
    <!-- pointed finial -->
    <path d="M0 -40 L-4 -56 L0 -66 L4 -56 Z" fill="#c9a961"/>
    <!-- turban wraps -->
    <path d="M-24 8 Q0 0 24 8 Q26 20 0 24 Q-26 20 -24 8 Z" fill="#e8e2d4"/>
    <path d="M-26 16 Q0 8 26 16 Q28 30 0 34 Q-28 30 -26 16 Z" fill="#dcd4c0"/>
    <path d="M-26 16 Q0 8 26 16" fill="none" stroke="#b8ae95" stroke-width="1.5"/>
    <!-- jewel on turban -->
    <path d="M0 2 l5 6 l-5 6 l-5 -6 z" fill="#3a6a5a"/>
    <!-- nasal -->
    <rect x="-2.5" y="-30" width="5" height="18" rx="2.5" fill="#c9a961"/>
  </g>

</svg>