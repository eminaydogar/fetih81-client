  <path d="M100 33 L164 51 L164 114 Q164 176 100 204 Q36 176 36 114 L36 51 Z"
        fill="none" stroke="#f4e9c8" stroke-width="1.5" stroke-opacity="0.5"/>


  <g transform="translate(100,116)">
    <!-- maedate (crescent crest) -->
    <path d="M-20 -44 Q0 -74 20 -44 Q10 -52 0 -52 Q-10 -52 -20 -44 Z" fill="#d4b455"/>
    <!-- kabuto bowl -->
    <path d="M-24 -18 Q-26 -44 0 -50 Q26 -44 24 -18 Z" fill="url(#metal)"/>
    <!-- fukigaeshi (side flares) -->
    <path d="M-24 -18 L-36 -6 L-24 4 Z" fill="#b23a2e"/>
    <path d="M24 -18 L36 -6 L24 4 Z" fill="#b23a2e"/>
    <!-- shikoro (neck lames) -->
