    <path d="M-32 8 Q0 18 32 8 L34 22 Q0 34 -34 22 Z" fill="#7a5d27"/>
    <path d="M-32 8 Q0 18 32 8" fill="none" stroke="#5a4520" stroke-width="1"/>
    <!-- menpo (fierce mask) -->
    <path d="M-16 6 Q-18 26 0 36 Q18 26 16 6 Q0 14 -16 6 Z" fill="#3a2418"/>
    <path d="M-10 16 Q0 20 10 16" fill="none" stroke="#c9a961" stroke-width="2"/>
    <!-- eyes -->
    <path d="M-14 -4 L-4 0 M14 -4 L4 0" stroke="#1a140a" stroke-width="3" stroke-linecap="round"/>
  </g>

</svg>