<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2f24"/>
      <stop offset="1" stop-color="#4a1a13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e9c8"/>
      <stop offset="0.5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer shield -->
  <path d="M100 6 L188 32 L188 120 Q188 196 100 234 Q12 196 12 120 L12 32 Z"
        fill="url(#metal)"/>
  <path d="M100 16 L180 39 L180 118 Q180 189 100 223 Q20 189 20 118 L20 39 Z"
        fill="#d4b455"/>
  <path d="M100 24 L172 45 L172 116 Q172 183 100 214 Q28 183 28 116 L28 45 Z"
        fill="url(#bg)"/>
  <path d="M100 24 L172 45 L172 116 Q172 183 100 214 Q28 183 28 116 L28 45 Z"
        fill="url(#glow)"/>
  <path d="M100 33 L164 51 L164 114 Q164 176 100 204 Q36 176 36 114 L36 51 Z"
        fill="none" stroke="#f4e9c8" stroke-width="1.5" stroke-opacity="0.5"/>


  <g transform="translate(100,116)">
    <!-- transverse crest (red brush, side-to-side) -->
    <path d="M-40 -46 Q0 -70 40 -46 Q40 -58 0 -60 Q-40 -58 -40 -46 Z" fill="#b23a2e"/>
    <path d="M-40 -46 Q0 -70 40 -46" fill="none" stroke="#7d2419" stroke-width="2"/>
    <!-- helmet bowl -->
    <path d="M-30 -8 Q-34 -50 0 -54 Q34 -50 30 -8 Z" fill="url(#metal)"/>
    <!-- neck/cheek guards -->
    <path d="M-30 -8 L-30 26 Q-30 36 -18 38 L-18 -6 Z" fill="#b8963f"/>
    <path d="M30 -8 L30 26 Q30 36 18 38 L18 -6 Z" fill="#b8963f"/>
    <!-- face gap -->
    <path d="M-18 -6 L18 -6 L18 32 Q0 40 -18 32 Z" fill="#2a1f14" opacity="0.55"/>
    <!-- brow band -->
    <path d="M-30 -8 Q0 -16 30 -8" fill="none" stroke="#8a6d2f" stroke-width="3"/>
    <!-- nose guard -->
    <rect x="-3" y="-6" width="6" height="24" rx="3" fill="#c9a961"/>
  </g>

</svg>