    <g stroke="#5a4a2a" stroke-width="2.5" stroke-linecap="round">
      <line x1="-10" y1="18" x2="-10" y2="26"/>
      <line x1="0" y1="20" x2="0" y2="28"/>
      <line x1="10" y1="18" x2="10" y2="26"/>
    </g>
    <!-- brow -->
    <path d="M-26 -46 Q0 -54 26 -46" fill="none" stroke="#8a6d2f" stroke-width="3"/>
    <line x1="0" y1="-52" x2="0" y2="-16" stroke="#8a6d2f" stroke-width="2" opacity="0.5"/>
  </g>

