    <path d="M0 -50 Q-18 -78 -6 -98 Q2 -84 6 -96 Q14 -78 0 -50" fill="#c0392b"/>
    <path d="M0 -50 Q-18 -78 -6 -98" fill="none" stroke="#7d2419" stroke-width="1.5" opacity="0.5"/>
    <!-- helmet -->
    <path d="M-26 -46 Q0 -54 26 -46 Q30 -6 22 30 Q0 42 -22 30 Q-30 -6 -26 -46 Z" fill="url(#metal)"/>
